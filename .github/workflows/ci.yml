name: CI

on:
  push:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          working-directory: go
          # autorelease stays off so publishing waits for the whole CI --
          # including the c-cpp job's cross-impl byte-identity check -- via
          # the publish job below (same buildhost action, same naming).
          autorelease: false

  # Publish the CLI matrix binaries to https://pazer.build. buildhost scopes a
  # repo's OIDC token to the repo's own namespace, and the binary name
  # (binpazer) differs from the repo name, so the action publishes it as the
  # nested project "bin-file-fmt/binpazer" (auto-provisioned on first publish,
  # git branch recorded on the release):
  #   https://dl.pazer.build/bin-file-fmt/binpazer?branch=<branch>&os=<os>&arch=<arch>
  publish:
    runs-on: ubuntu-latest
    needs: [go, c-cpp]
    permissions:
      id-token: write # mint the OIDC token buildhost trusts
      contents: read
      deployments: write # buildhost-publish registers the publish as a GitHub Deployment
      artifact-metadata: write # ... and records what buildhost stores on the org's linked artifacts page
      actions: read # all-builds guard (embedded in buildhost-publish) scans this run's jobs
      checks: read # ... and the head commit's check runs
    steps:
      # go-toolchain hands go/build off through the org cache, not a GHA
      # artifact (org CI runs with artifact storage exhausted). It saves two
      # hand-offs -- the per-job name plus the deprecated bare `go-build`
      # alias -- so nameless discovery is ambiguous and the name is explicit.
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-go
          path: build
      - uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish@master
        with:
          path: build

  c-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: C tests
        run: make -C c test
      - name: C++ tests
        run: make -C cpp test
      - name: C tests (ASan + UBSan)
        run: |
          cc -std=c11 -Wall -Wextra -O1 -fsanitize=address,undefined -fno-sanitize-recover=all c/binpazer.c c/test.c -o /tmp/test_c_san
          /tmp/test_c_san
      - name: C++ tests (ASan + UBSan)
        run: |
          c++ -std=c++17 -Wall -Wextra -O1 -fsanitize=address,undefined -fno-sanitize-recover=all -Ic cpp/test.cpp c/binpazer.c -o /tmp/test_cpp_san
          /tmp/test_cpp_san
      - name: Cross-impl fixture is reproducible
        run: |
          cc -std=c11 -O2 c/binpazer.c c/gen.c -o /tmp/binpazer_gen
          /tmp/binpazer_gen /tmp/sample.binpazer
          cmp /tmp/sample.binpazer go/testdata/sample.binpazer

name: CI

on:
  push:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          working-directory: go
          # autorelease stays off so publishing waits for the whole CI --
          # including the c-cpp job's cross-impl byte-identity check -- via
          # the publish job below (same buildhost action, same naming).
          autorelease: false
          upload-artifacts: true

  # Publish the CLI matrix binaries from the go-build artifact to
  # https://pazer.build. buildhost scopes a repo's OIDC token to the repo's
  # own namespace, and the binary name (binpazer) differs from the repo
  # name, so the action publishes it as the nested project
  # "bin-file-fmt/binpazer" (auto-provisioned on first publish, git branch
  # recorded on the release):
  #   https://dl.pazer.build/bin-file-fmt/binpazer?branch=<branch>&os=<os>&arch=<arch>
  publish:
    runs-on: ubuntu-latest
    needs: [go, c-cpp]
    permissions:
      id-token: write # mint the OIDC token buildhost trusts
      actions: read # download the go-build artifact from this run
      contents: read
      checks: read # all-builds guard (embedded in buildhost-publish) scans this run's checks
    steps:
      - uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish@master

  c-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: C tests
        run: make -C c test
      - name: C++ tests
        run: make -C cpp test
      - name: C tests (ASan + UBSan)
        run: |
          cc -std=c11 -Wall -Wextra -O1 -fsanitize=address,undefined -fno-sanitize-recover=all c/binpazer.c c/test.c -o /tmp/test_c_san
          /tmp/test_c_san
      - name: C++ tests (ASan + UBSan)
        run: |
          c++ -std=c++17 -Wall -Wextra -O1 -fsanitize=address,undefined -fno-sanitize-recover=all -Ic cpp/test.cpp c/binpazer.c -o /tmp/test_cpp_san
          /tmp/test_cpp_san
      - name: Cross-impl fixture is reproducible
        run: |
          cc -std=c11 -O2 c/binpazer.c c/gen.c -o /tmp/binpazer_gen
          /tmp/binpazer_gen /tmp/sample.binpazer
          cmp /tmp/sample.binpazer go/testdata/sample.binpazer

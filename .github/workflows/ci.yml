name: CI

on:
  push:

permissions:
  contents: read

jobs:
  go:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      id-token: write
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          working-directory: go
          # autorelease stays off so publishing waits for the whole CI --
          # including the c-cpp job's cross-impl byte-identity check -- via
          # the publish job below (same buildhost action, same naming).
          autorelease: false

      # Parity between implementations is a claim about DECODING, not about
      # bytes: a real codec's encoder output is implementation-defined, so zlib
      # and klauspost/compress are not expected to agree bit for bit (the
      # byte-identity fixtures in c-cpp cover the uncompressed and `stored`
      # cases, where they must). What has to hold is that each implementation
      # reads what the other writes, for every codec in the registry -- so it
      # is checked here, in both directions, rather than asserted in a doc.
      - name: Codec libraries for the C implementation
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zlib1g-dev libzstd-dev liblz4-dev
      # go-toolchain does not leave build/ in the workspace -- it hands the
      # binaries off through the org cache (which is how the publish job gets
      # them). Take the same hand-off rather than rebuilding the CLI.
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-go
          path: go/build
      - name: Cross-impl codec interop (C <-> Go)
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            const dir = 'interop-out';
            fs.mkdirSync(dir, { recursive: true });

            const interop = path.join(dir, 'interop');
            const payloadFile = path.join(dir, 'payload.bin');

            // explicit return type: the action type-checks with strict: true, and a recursive arrow cannot infer its own return type
            const walk = (d: string): string[] =>
              fs.readdirSync(d, { withFileTypes: true }).flatMap((e): string[] => {
                const p = path.join(d, e.name);
                return e.isDirectory() ? walk(p) : [p];
              });
            // search go/build rather than hard-coding a path -- the hand-off's layout is go-toolchain's to change
            const built: string[] = fs.existsSync('go/build') ? walk('go/build') : [];
            const bp = built.find((f: string) => path.basename(f) === 'binpazer')
              ?? built.find((f: string) => /binpazer.*linux.*amd64/.test(path.basename(f)));
            if (!bp) {
              core.setFailed(`no linux/amd64 binpazer in the build hand-off (found: ${built.join(', ') || 'nothing'})`);
              return;
            }
            core.info(`using CLI ${bp}`);
            fs.chmodSync(bp, 0o755); // the cache round-trip need not preserve the mode

            // each ${...} in a $`` template is interpolated as one argument, never glued to adjacent literal text -- that is what makes it injection-proof
            await $`cc -std=c11 -Wall -Wextra -Wpedantic -O2 c/binpazer.c c/binpazer_codec.c c/interop.c -o ${interop} -lz -lzstd -llz4`;
            await $`${interop} payload ${payloadFile}`;
            await $`${interop} write ${dir}`;
            const payload = fs.readFileSync(payloadFile);

            for (const codec of ['stored', 'deflate', 'zstd', 'lz4']) {
              // Go decodes what C wrote.
              const fromC = path.join(dir, `c-${codec}.binpazer`);
              const decoded = path.join(dir, `go-read-${codec}.bin`);
              await $`${bp} cat ${fromC} --type 1 -o ${decoded}`;
              if (!payload.equals(fs.readFileSync(decoded))) {
                core.setFailed(`Go decoded C's ${codec} block to different bytes`);
                continue;
              }
              // C decodes what Go wrote.
              const manifest = path.join(dir, `manifest-${codec}.json`);
              const fromGo = path.join(dir, `go-${codec}.binpazer`);
              // a manifest's `file` resolves relative to the manifest, so the payload sits beside it
              fs.writeFileSync(manifest, JSON.stringify({
                writer_guid: '01000000-0000-0000-0000-000000000000',
                writer_name: 'interop',
                types: [{ type_id: 1, guid: '11000000-0000-0000-0000-000000000000', name: 'Payload' }],
                blocks: [{ type_id: 1, flags: ['has_crc'], codec, file: 'payload.bin' }],
              }));
              await $`${bp} pack ${manifest} -o ${fromGo}`;
              await $`${interop} read ${fromGo}`;
              core.info(`${codec}: C->Go and Go->C both decode`);
            }

  # Publish the CLI matrix binaries to https://pazer.build. buildhost scopes a
  # repo's OIDC token to the repo's own namespace, and the binary name
  # (binpazer) differs from the repo name, so the action publishes it as the
  # nested project "bin-file-fmt/binpazer" (auto-provisioned on first publish,
  # git branch recorded on the release):
  #   https://dl.pazer.build/bin-file-fmt/binpazer?branch=<branch>&os=<os>&arch=<arch>
  publish:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    needs: [go, c-cpp]
    permissions:
      id-token: write # mint the OIDC token buildhost trusts
      contents: read
      deployments: write # buildhost-publish registers the publish as a GitHub Deployment
      artifact-metadata: write # ... and records what buildhost stores on the org's linked artifacts page
      actions: read # all-builds guard (embedded in buildhost-publish) scans this run's jobs
      checks: read # ... and the head commit's check runs
    steps:
      # go-toolchain hands go/build off through the org cache, not a GHA
      # artifact (org CI runs with artifact storage exhausted). It saves two
      # hand-offs -- the per-job name plus the deprecated bare `go-build`
      # alias -- so nameless discovery is ambiguous and the name is explicit.
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-go
          path: build
      - uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish@master
        with:
          path: build

  c-cpp:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Codec libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zlib1g-dev libzstd-dev liblz4-dev
      # Each `make test` builds two binaries: the core one, which links nothing
      # but libc and proves the core stayed dependency-free, and the codec one.
      - name: C tests
        run: make -C c test
      - name: C++ tests
        run: make -C cpp test
      - name: C tests (ASan + UBSan)
        run: |
          cc -std=c11 -Wall -Wextra -O1 -fsanitize=address,undefined -fno-sanitize-recover=all c/binpazer.c c/test.c -o /tmp/test_c_san
          /tmp/test_c_san
          cc -std=c11 -Wall -Wextra -O1 -fsanitize=address,undefined -fno-sanitize-recover=all c/binpazer.c c/binpazer_codec.c c/test_codec.c -o /tmp/test_codec_san -lz -lzstd -llz4
          /tmp/test_codec_san
      - name: C++ tests (ASan + UBSan)
        run: |
          c++ -std=c++17 -Wall -Wextra -O1 -fsanitize=address,undefined -fno-sanitize-recover=all -Ic cpp/test.cpp c/binpazer.c -o /tmp/test_cpp_san
          /tmp/test_cpp_san
          c++ -std=c++17 -Wall -Wextra -O1 -fsanitize=address,undefined -fno-sanitize-recover=all -Ic cpp/test_codec.cpp c/binpazer.c c/binpazer_codec.c -o /tmp/test_cpp_codec_san -lz -lzstd -llz4
          /tmp/test_cpp_codec_san
      - name: Cross-impl fixtures are reproducible
        run: |
          cc -std=c11 -O2 c/binpazer.c c/gen.c -o /tmp/binpazer_gen
          /tmp/binpazer_gen /tmp/sample.binpazer /tmp/sample-compressed.binpazer
          cmp /tmp/sample.binpazer go/testdata/sample.binpazer
          # The compressed fixture pins the Compression Envelope's bytes across
          # all three implementations, the way the plain one pins block bytes.
          cmp /tmp/sample-compressed.binpazer go/testdata/sample-compressed.binpazer

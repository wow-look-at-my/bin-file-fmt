name: CI

on:
  push:
    branches: ['**']

concurrency:
  group: gha_${{ github.repository }}_${{ github.workflow }}_${{ github.ref != 'refs/heads/master' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  id-token: write
  contents: read

jobs:
  go:
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      id-token: write
      contents: write
      actions: read
      checks: read
      deployments: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@lkgb
        with:
          working-directory: go
          # autorelease stays off so publishing waits for the whole CI -- including the c-cpp job's cross-impl byte-identity check. Via the publish job below (same buildhost action, same naming).
          autorelease: false

      # Parity between implementations is a claim about DECODING, not about bytes. A real codec's encoder output is implementation-defined, so zlib and klauspost/compress are not expected to agree bit for bit (the byte-identity fixtures in c-cpp cover the uncompressed and `stored` cases, where they must). What has to hold is that each implementation reads what the other writes, for every codec in the registry -- so it is checked here. That implementation is in both directions, rather than asserted in a doc.
      - name: Codec libraries for the C implementation
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential zlib1g-dev libzstd-dev liblz4-dev
      # go-toolchain does not leave build/ in the workspace -- it hands the binaries off through the org cache (which is how the publish job gets them). Take the same hand-off rather than rebuilding the CLI. go-toolchain names it go-build-<job>.b<working-directory id>, and the working directory is `go`, so the name is go-build-go.bgo.
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-go.bgo
          path: go/build
      - name: Cross-impl codec interop (C <-> Go)
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            const dir = 'interop-out';
            fs.mkdirSync(dir, { recursive: true });

            const interop = path.join(dir, 'interop');
            const payloadFile = path.join(dir, 'payload.bin');

            // explicit return type: the action type-checks with strict: true, and a recursive arrow cannot infer its own return type
            const walk = (d: string): string[] =>
              fs.readdirSync(d, { withFileTypes: true }).flatMap((e): string[] => {
                const p = path.join(d, e.name);
                return e.isDirectory() ? walk(p) : [p];
              });
            // search go/build rather than hard-coding a path -- the hand-off's layout is go-toolchain's to change
            const built: string[] = fs.existsSync('go/build') ? walk('go/build') : [];
            const bp = built.find((f: string) => path.basename(f) === 'binpazer')
              ?? built.find((f: string) => /binpazer.*linux.*amd64/.test(path.basename(f)));
            if (!bp) {
              core.setFailed(`no linux/amd64 binpazer in the build hand-off (found: ${built.join(', ') || 'nothing'})`);
              return;
            }
            core.info(`using CLI ${bp}`);
            fs.chmodSync(bp, 0o755); // the cache round-trip need not preserve the mode

            // each ${...} in a $`` template is interpolated as one argument, never glued to adjacent literal text -- that is what makes it injection-proof
            await $`cc -std=c11 -Wall -Wextra -Wpedantic -O2 c/binpazer.c c/binpazer_codec.c c/interop.c -o ${interop} -lz -lzstd -llz4`;
            await $`${interop} payload ${payloadFile}`;
            await $`${interop} write ${dir}`;
            const payload = fs.readFileSync(payloadFile);

            for (const codec of ['stored', 'deflate', 'zstd', 'lz4']) {
              // Go decodes what C wrote.
              const fromC = path.join(dir, `c-${codec}.binpazer`);
              const decoded = path.join(dir, `go-read-${codec}.bin`);
              await $`${bp} cat ${fromC} --type 1 -o ${decoded}`;
              if (!payload.equals(fs.readFileSync(decoded))) {
                core.setFailed(`Go decoded C's ${codec} block to different bytes`);
                continue;
              }
              // C decodes what Go wrote.
              const manifest = path.join(dir, `manifest-${codec}.json`);
              const fromGo = path.join(dir, `go-${codec}.binpazer`);
              // a manifest's `file` resolves relative to the manifest, so the payload sits beside it
              fs.writeFileSync(manifest, JSON.stringify({
                writer_guid: '01000000-0000-0000-0000-000000000000',
                writer_name: 'interop',
                types: [{ type_id: 1, guid: '11000000-0000-0000-0000-000000000000', name: 'Payload' }],
                blocks: [{ type_id: 1, flags: ['has_crc'], codec, file: 'payload.bin' }],
              }));
              await $`${bp} pack ${manifest} -o ${fromGo}`;
              await $`${interop} read ${fromGo}`;
              core.info(`${codec}: C->Go and Go->C both decode`);
            }

  # Publish the CLI matrix binaries to https://pazer.build. buildhost scopes a repo's OIDC token to the repo's own namespace, and the binary name (binpazer) differs from the repo name. The action publishes it as the nested project "bin-file-fmt/binpazer" (auto-provisioned on first publish, git branch recorded on the release): https://dl.pazer.build/bin-file-fmt/binpazer?branch=<branch>&os=<os>&arch=<arch>
  publish:
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    needs: [go, c-cpp, c-arm64, ts, py, bench]
    permissions:
      id-token: write # mint the OIDC token buildhost trusts
      contents: read
      deployments: write # buildhost-publish registers the publish as a GitHub Deployment
      artifact-metadata: write # ... and records what buildhost stores on the org's linked artifacts page
      actions: read # all-builds guard (embedded in buildhost-publish) scans this run's jobs
      checks: read # ... and the head commit's check runs
    steps:
      # go-toolchain hands go/build off through the org cache, not a GHA artifact (org CI runs with artifact storage exhausted). Its name is go-build-<job>.b<working-directory id>, which for the `go` job over `go` is go-build-go.bgo.
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-go.bgo
          path: build
      - uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish@lkgb
        with:
          path: build

  # The TypeScript implementation: ts0 type-checks, runs the suite and builds. The suite compiles c/interop.c and runs the reference lz4 tool, so both go in first.
  ts:
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Codec libraries and the reference lz4 tool
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential zlib1g-dev libzstd-dev liblz4-dev lz4
      - uses: wow-look-at-my/ts0@lkgb
        with:
          working-directory: ts

  # The arm64 CRC-32C paths on real arm64 CPUs: a Linux server core and Apple silicon. The emulator in a developer's session proves the result, not the speed, so the job also prints the throughput of every tier to its summary.
  c-arm64:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest]
    if: github.event.repository.visibility == 'public'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: C core tests at every CRC tier
        run: make -C c test-core
      - name: CRC-32C throughput per tier
        shell: bash
        run: make -C c speed | tee -a "$GITHUB_STEP_SUMMARY"
      # XXH3 on the same CPU shows whether a hash other than CRC-32C would be faster there.
      - name: XXH3 throughput (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libxxhash-dev
          make -C c speed-xxh3 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: XXH3 throughput (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install xxhash
          make -C c speed-xxh3 XXH_INC="-I$(brew --prefix)/include" | tee -a "$GITHUB_STEP_SUMMARY"

  # The Python implementation: the standard-library test runner. The suite compiles c/interop.c, and the codec layer loads libzstd and liblz4, so the codec libraries go in first.
  py:
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Codec libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential zlib1g-dev libzstd-dev liblz4-dev
      - name: Python tests
        run: make -C py test

  # Runs every implementation through the same workloads in quick mode, with the CPU profiles. The driver fails when implementations disagree on a file or a checksum, so this is also the live interop check across all of them. The numbers of a shared runner are noisy: the committed bench/RESULTS.md comes from a full run on one machine.
  bench:
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    needs: [go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # The gprof builds link statically, and a static liblz4 can need libxxhash. pkg-config names what the static link needs.
      - name: Codec libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config zlib1g-dev libzstd-dev liblz4-dev libxxhash-dev
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-go.bgo
          path: go/build
      - name: C and C++ bench programs, plain and gprof builds
        run: make -C bench all prof
      - name: TypeScript bench program
        uses: wow-look-at-my/ts0@lkgb
        with:
          working-directory: ts
      - name: Driver type-check and unit tests
        uses: wow-look-at-my/ts0@lkgb
        with:
          working-directory: bench
      - name: Quick benchmark across all implementations
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            const walk = (d: string): string[] =>
              fs.readdirSync(d, { withFileTypes: true }).flatMap((e): string[] => {
                const p = path.join(d, e.name);
                return e.isDirectory() ? walk(p) : [p];
              });
            const built: string[] = fs.existsSync('go/build') ? walk('go/build') : [];
            const bp = built.find((f: string) => path.basename(f) === 'binpazer')
              ?? built.find((f: string) => /binpazer.*linux.*amd64/.test(path.basename(f)));
            if (!bp) {
              core.setFailed(`no linux/amd64 binpazer in the build hand-off (found: ${built.join(', ') || 'nothing'})`);
              return;
            }
            fs.chmodSync(bp, 0o755);
            await $`node bench/run.ts --quick --profile --go-bin ${bp}`;
            await core.summary.addRaw(fs.readFileSync('bench/work/RESULTS.md', 'utf-8')).write();

  c-cpp:
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Codec libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential zlib1g-dev libzstd-dev liblz4-dev
      # Each `make test` builds two binaries: the core one, which links nothing but libc and proves the core stayed dependency-free, and the codec one.
      - name: C tests
        run: make -C c test
      - name: C++ tests
        run: make -C cpp test
      - name: C tests (ASan + UBSan)
        run: |
          cc -std=c11 -Wall -Wextra -O1 -fsanitize=address,undefined -fno-sanitize-recover=all c/binpazer.c c/test.c -o /tmp/test_c_san
          /tmp/test_c_san
          cc -std=c11 -Wall -Wextra -O1 -fsanitize=address,undefined -fno-sanitize-recover=all c/binpazer.c c/test_append.c -o /tmp/test_append_san
          /tmp/test_append_san go/testdata
          cc -std=c11 -Wall -Wextra -O1 -fsanitize=address,undefined -fno-sanitize-recover=all c/binpazer.c c/binpazer_codec.c c/test_codec.c -o /tmp/test_codec_san -lz -lzstd -llz4
          /tmp/test_codec_san
      - name: C++ tests (ASan + UBSan)
        run: |
          c++ -std=c++17 -Wall -Wextra -O1 -fsanitize=address,undefined -fno-sanitize-recover=all -Ic cpp/test.cpp c/binpazer.c -o /tmp/test_cpp_san
          /tmp/test_cpp_san
          c++ -std=c++17 -Wall -Wextra -O1 -fsanitize=address,undefined -fno-sanitize-recover=all -Ic cpp/test_append.cpp c/binpazer.c -o /tmp/test_cpp_append_san
          /tmp/test_cpp_append_san
          c++ -std=c++17 -Wall -Wextra -O1 -fsanitize=address,undefined -fno-sanitize-recover=all -Ic cpp/test_codec.cpp c/binpazer.c c/binpazer_codec.c -o /tmp/test_cpp_codec_san -lz -lzstd -llz4
          /tmp/test_cpp_codec_san
      - name: Cross-impl fixtures are reproducible
        run: |
          cc -std=c11 -O2 c/binpazer.c c/gen.c -o /tmp/binpazer_gen
          /tmp/binpazer_gen /tmp/sample.binpazer /tmp/sample-compressed.binpazer
          cmp /tmp/sample.binpazer go/testdata/sample.binpazer
          # The compressed fixture pins the Compression Envelope's bytes across
          # all three implementations, the way the plain one pins block bytes.
          cmp /tmp/sample-compressed.binpazer go/testdata/sample-compressed.binpazer
